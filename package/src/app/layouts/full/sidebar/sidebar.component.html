<div class="d-flex align-items-center justify-content-between p-x-20 p-y-16">
  <app-branding></app-branding>

  <div class="d-flex align-items-center gap-8">
    <a href="javascript:void(0)" (click)="themeService.toggle()"
      class="d-flex justify-content-center icon-40 align-items-center"
      [title]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'">
      <i-tabler [name]="themeService.isDark() ? 'sun' : 'moon'" class="icon-20 d-flex"></i-tabler>
    </a>

    @if(showToggle) {
    <a href="javascript:void(0)" (click)="toggleMobileNav.emit()"
      class="d-flex justify-content-center icon-40 align-items-center">
      <i-tabler name="x" class="icon-20 d-flex"></i-tabler>
    </a>
    }
  </div>
</div>
