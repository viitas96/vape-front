<div class="p-24">
  <mat-card class="cardWithShadow">
    <mat-card-content class="p-32">

      <div class="d-flex align-items-center justify-content-between m-b-24">
        <h2 class="f-s-20 f-w-700">{{ 'GROUPS.TITLE' | translate }}</h2>
        <button mat-flat-button color="primary" (click)="openDialog()">
          <mat-icon>add</mat-icon> {{ 'GROUPS.ADD' | translate }}
        </button>
      </div>

      @if (successMessage) {
        <p class="text-success f-s-14 m-b-16">{{ successMessage }}</p>
      }
      @if (errorMessage) {
        <p class="text-danger f-s-14 m-b-16">{{ errorMessage }}</p>
      }

      <mat-table [dataSource]="groups">

        <ng-container matColumnDef="id">
          <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
          <mat-cell *matCellDef="let g">{{ g.id }}</mat-cell>
        </ng-container>

        <ng-container matColumnDef="name">
          <mat-header-cell *matHeaderCellDef>{{ 'PRODUCTS.NAME' | translate }}</mat-header-cell>
          <mat-cell *matCellDef="let g">{{ g.name }}</mat-cell>
        </ng-container>

        <ng-container matColumnDef="actions">
          <mat-header-cell *matHeaderCellDef>{{ 'PRODUCTS.ACTIONS' | translate }}</mat-header-cell>
          <mat-cell *matCellDef="let g">
            <button mat-icon-button color="primary" (click)="openDialog(g)" title="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="delete(g)" title="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell p-16" [attr.colspan]="displayedColumns.length">{{ 'GROUPS.EMPTY' | translate }}</td>
        </tr>

      </mat-table>

    </mat-card-content>
  </mat-card>
</div>
