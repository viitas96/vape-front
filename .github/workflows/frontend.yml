name: Frontend

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version already in GHCR to deploy (e.g. 1.2.3)
        required: true

env:
  IMAGE: ghcr.io/viitas96/vape-front
  SERVICE: frontend
  TAG_VARIABLE: FRONTEND_TAG
  HEALTH_URL: http://127.0.0.1:8081/health

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Resolve version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - if: steps.version.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: package
          push: ${{ steps.version.outputs.push == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref_type == 'tag' && needs.build.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Resolve version
        env:
          BUILT_VERSION: ${{ needs.build.outputs.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${BUILT_VERSION:-${INPUT_VERSION#v}}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: '${VERSION}'"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -p "${VPS_PORT}" -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" bash -s <<EOF
          set -euo pipefail
          cd /opt/vape-store/app

          git pull --ff-only -q

          echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker pull "${IMAGE}:${VERSION}"

          if grep -q '^${TAG_VARIABLE}=' .env; then
            sed -i 's/^${TAG_VARIABLE}=.*/${TAG_VARIABLE}=${VERSION}/' .env
          else
            echo '${TAG_VARIABLE}=${VERSION}' >> .env
          fi

          docker compose up -d --no-deps "${SERVICE}"

          for attempt in \$(seq 1 24); do
            if curl -fsS "${HEALTH_URL}" >/dev/null; then
              echo "${SERVICE} ${VERSION} is healthy"
              docker image prune -f >/dev/null
              exit 0
            fi
            sleep 5
          done

          echo "${SERVICE} ${VERSION} did not become healthy in 2 minutes"
          docker compose logs --tail 150 "${SERVICE}"
          exit 1
          EOF
